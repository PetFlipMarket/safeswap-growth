name: Nightly clips

on:
  schedule:
    - cron: "30 2 * * *"   # 03:30 UK — clips are waiting in creators' dashboards by morning
  workflow_dispatch:
    inputs:
      count:
        description: "How many clips to render"
        default: "6"

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SAFESWAP_READONLY_DB_URL: ${{ secrets.SAFESWAP_READONLY_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CLIPS_PER_NIGHT: ${{ github.event.inputs.count || '6' }}
      KOKORO_DIR: ${{ github.workspace }}/jobs/kokoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Install ffmpeg and emoji font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: jobs/kokoro
          key: kokoro-v1.0
      - name: Download voice model
        working-directory: jobs
        run: |
          mkdir -p kokoro
          [ -f kokoro/kokoro-v1.0.onnx ] || curl -sSL -o kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f kokoro/voices-v1.0.bin ] || curl -sSL -o kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Render and publish clips
        working-directory: jobs/clips
        shell: bash
        run: |
          set -o pipefail
          python make_clips.py 2>&1 | tee out.txt || { echo "::error title=clips::$(tail -c 1500 out.txt | tr '\n' ' ')"; exit 1; }
